# XcodeGen spec. On your Mac:
#   brew install xcodegen
#   xcodegen generate
#   open WorkoutApp.xcodeproj
# Set your team and bundle ID once (kept out of git, survives regenerating):
#   scripts/set-signing.sh <TEAM_ID> com.yourname.workoutapp
name: WorkoutApp

options:
  bundleIdPrefix: com.lontraindustries
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Code that needs the iOS 27 SDK (Xcode 27+): FoundationModels'
    # LanguageModelError in OnDeviceCoach. CI builds with Xcode 26 and
    # overrides this to empty on the xcodebuild command line.
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TENSILE_IOS27_SDK"

packages:
  AppCore:
    path: Packages/AppCore

targets:
  WorkoutApp:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
    sources:
      - path: App
      - path: Shared
        # Watch-only: compiled by the two watch targets below.
        excludes:
          - WatchPalette.swift
          - WatchGauges.swift
      # How cardio activities map to Apple Health workouts (also on the Watch).
      - path: SharedCardio
      # Privacy manifest (UserDefaults: CA92.1 own data, 1C8F.1 the shared App
      # Group). Nothing is collected or tracked: data stays on the device.
      - path: Privacy/App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: AppCore
      - sdk: HealthKit.framework
      - target: WorkoutWidget
      # The Apple Watch app ships inside the iPhone app ("Embed Watch Content").
      - target: TensileWatch
        embed: true
    entitlements:
      path: App/WorkoutApp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Lets HealthKit wake the app after new data (e.g. a Garmin sync).
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups:
          - group.com.lontraindustries.workoutapp
        # Rest-timer alerts can break through Focus modes.
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tensile
        UILaunchScreen: {}
        # "workout-processing" is a watchOS-only value (App Store upload rejects it
        # on iOS: "Invalid Info.plist value"); the Watch app declares it in
        # WKBackgroundModes. The iPhone's own workout session (AirPods heart rate)
        # keeps running while the workout is active without it.
        UIBackgroundModes:
          - fetch
        # The coach's check-ins refresh in the background (`CoachNudges.backgroundRefresh`).
        BGTaskSchedulerPermittedIdentifiers:
          - com.lontraindustries.workoutapp.coach-refresh
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.lontraindustries.workoutapp
            CFBundleURLSchemes:
              - workoutapp
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Uses only Apple's standard encryption (HTTPS), so TestFlight and App
        # Store uploads skip the export-compliance question.
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: >-
          Tensile reads your heart rate, HRV, resting heart rate, sleep, workouts,
          body weight and food log (for example from Cronometer) to calculate your
          daily scores and give coaching advice.
        NSCameraUsageDescription: >-
          Tensile uses the camera for your front and side progress photos (saved only
          inside the app, not in your Photos library) and, with the flashlight, to measure
          your heart rate variability from your fingertip.
        # Planned sessions in Apple Calendar (`PlanCalendarSync`), only once that switch is on.
        # Full access: write-only access can't update or remove the app's own events.
        NSCalendarsFullAccessUsageDescription: >-
          Tensile puts your planned sessions in its own "Tensile" calendar and keeps them
          in step when your plan changes. It reads and changes only that calendar.
        NSLocationWhenInUseUsageDescription: >-
          Tensile uses your location once to get local weather, air quality and
          daylight hours for training advice. You can type your city instead.
        NSHealthUpdateUsageDescription: >-
          Tensile saves the gym workouts (with your effort rating), blood pressure
          readings, check-in mood and quick meal estimates you log to
          Apple Health.
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

  # Home/Lock Screen widget and the medications Live Activity.
  WorkoutWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: Widget
      - path: Shared
        excludes:
          - WatchPalette.swift
          - WatchGauges.swift
      - path: Privacy/Widget/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      # Shared/SharedStore.swift uses AppCore's MedicationSchedule (the Live Activity's doses).
      - package: AppCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework
    entitlements:
      path: Widget/WorkoutWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.lontraindustries.workoutapp
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Tensile
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        # The app's bundle ID (from Config) plus ".widget".
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).widget
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: ""

  # Apple Watch app: logs sets and records the workout (heart rate, calories) on the
  # wrist, so each gym session is one HKWorkout; also records cardio workouts with
  # live heart-rate zones. Single-target watch app (no WatchKit extension); bundle
  # ID is the iPhone app's plus ".watchkitapp".
  TensileWatch:
    type: application
    platform: watchOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
    sources:
      - path: Watch
      - path: Privacy/Watch/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Only the session model and the complications' data are shared: the
      # other Shared files need ActivityKit.
      - path: Shared/WatchSession.swift
      - path: Shared/WatchFaceData.swift
      # Colours and the recovery/strain gauges, shared with the complications.
      - path: Shared/WatchPalette.swift
      - path: Shared/WatchGauges.swift
      # The experimental rep counter's signal maths (pure Swift).
      - path: Packages/AppCore/Sources/AppCore/RepDetection.swift
      # Heart-rate zones and the cardio mode's zone clock (pure Swift).
      - path: Packages/AppCore/Sources/AppCore/HeartRateZoneScheme.swift
      - path: Packages/AppCore/Sources/AppCore/CardioZoneTracker.swift
      # The route's distance, speed and elevation for the end screen.
      - path: Packages/AppCore/Sources/AppCore/CardioRoute.swift
      # The redesign's pure logic (Foundation only): the crown's load steps,
      # laps and current pace, rest cues, and the heart-rate series for charts.
      - path: Packages/AppCore/Sources/AppCore/LoadStepper.swift
      - path: Packages/AppCore/Sources/AppCore/LapTracker.swift
      - path: Packages/AppCore/Sources/AppCore/RestCues.swift
      - path: Packages/AppCore/Sources/AppCore/HeartRateSeries.swift
      # Home's glance and plan card use the complications' own rules, so the
      # two never disagree (Foundation only).
      - path: Packages/AppCore/Sources/AppCore/Glances.swift
      - path: WatchWidgets/PlanFace.swift
      # This week's hard cardio session, run step by step on the wrist (Foundation
      # and HeartRateZoneScheme.swift only).
      - path: Packages/AppCore/Sources/AppCore/IntervalSession.swift
      - path: Packages/AppCore/Sources/AppCore/IntervalSession+Zones.swift
      - path: Packages/AppCore/Sources/AppCore/IntervalSession+Progress.swift
      - path: SharedCardio
    dependencies:
      - sdk: HealthKit.framework
      - sdk: WatchConnectivity.framework
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      # "Start a workout in Tensile" for Siri and Shortcuts (Watch/WatchShortcuts.swift).
      - sdk: AppIntents.framework
      # Watch face complications, embedded in the Watch app (PlugIns).
      - target: TensileWatchWidgets
        embed: true
    entitlements:
      path: Watch/TensileWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Shares the complications' data with TensileWatchWidgets.
        com.apple.security.application-groups:
          - group.com.lontraindustries.workoutapp
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Tensile
        WKApplication: true
        # Complication taps open tensile://start.
        CFBundleURLTypes:
          - CFBundleURLName: com.lontraindustries.workoutapp.watchkitapp
            CFBundleURLSchemes:
              - tensile
        # The iPhone app's bundle ID (Config/Base.xcconfig, or Signing.local.xcconfig).
        WKCompanionAppBundleIdentifier: $(COMPANION_APP_BUNDLE_IDENTIFIER)
        WKBackgroundModes:
          - workout-processing
        NSLocationWhenInUseUsageDescription: >-
          Tensile records the route of an outdoor workout (a run, a ride, skiing)
          while it records, so you can see it on a map with your speed and heart rate.
          The route is saved to Apple Health.
        NSHealthShareUsageDescription: >-
          Tensile reads your heart rate, active energy and distance during a workout
          to show them on your wrist, and your date of birth to estimate heart-rate
          zones when your iPhone hasn't sent any.
        NSHealthUpdateUsageDescription: >-
          Tensile saves your gym and cardio workouts, with heart rate and calories, to
          Apple Health.
        NSMotionUsageDescription: >-
          Tensile reads your wrist's motion during squat and deadlift sets to count
          reps, only when rep counting is on.
    settings:
      base:
        SDKROOT: watchos
        # The app's bundle ID (from Config) plus ".watchkitapp".
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).watchkitapp
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: $(COMPANION_APP_BUNDLE_IDENTIFIER)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        TARGETED_DEVICE_FAMILY: "4"

  # Watch face complications (WidgetKit): recovery + strain, and today's
  # plan. Reads what the Watch app stores in the App Group.
  TensileWatchWidgets:
    type: app-extension
    platform: watchOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: WatchWidgets
      - path: Privacy/WatchWidgets/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared/WatchFaceData.swift
      # Colours and gauges, the same as the Watch app's.
      - path: Shared/WatchPalette.swift
      - path: Shared/WatchGauges.swift
      # What the plan says when, and when a score goes "--" (pure Swift; the
      # iPhone widgets get the same rules from AppCore).
      - path: Packages/AppCore/Sources/AppCore/Glances.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: WatchWidgets/TensileWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.lontraindustries.workoutapp
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Tensile
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SDKROOT: watchos
        # The app's bundle ID (from Config) plus ".watchkitapp.widgets".
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: ""

  # UI tests (run in CI on a simulator).
  WorkoutAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: WorkoutApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lontraindustries.workoutapp.uitests
        TEST_TARGET_NAME: WorkoutApp
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  WorkoutApp:
    build:
      targets:
        WorkoutApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WorkoutAppUITests
    archive:
      config: Release
  # Runs the Watch app straight on the Watch (pick your Apple Watch as the
  # destination). The WorkoutApp scheme is iOS-only, so choosing the Watch
  # there gives "mismatched platform"; this one also shows the Watch's own
  # install error and lets automatic signing register a new Watch.
  TensileWatch:
    build:
      targets:
        TensileWatch: all
    run:
      config: Debug
    archive:
      config: Release
