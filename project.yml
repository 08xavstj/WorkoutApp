# XcodeGen spec. On your Mac:
#   brew install xcodegen
#   xcodegen generate
#   open WorkoutApp.xcodeproj
# Set your team and bundle ID once (kept out of git, survives regenerating):
#   scripts/set-signing.sh <TEAM_ID> com.yourname.workoutapp
name: WorkoutApp

options:
  bundleIdPrefix: com.lontraindustries
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  AppCore:
    path: Packages/AppCore

targets:
  WorkoutApp:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
    sources:
      - path: App
    dependencies:
      - package: AppCore
      - sdk: HealthKit.framework
    entitlements:
      path: App/WorkoutApp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: WorkoutApp
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: >-
          WorkoutApp reads your heart rate, HRV, resting heart rate, sleep, workouts,
          body weight and food log (for example from Cronometer) to calculate your
          daily scores and give coaching advice.
        NSHealthUpdateUsageDescription: >-
          WorkoutApp saves the gym workouts you log to Apple Health.
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  WorkoutApp:
    build:
      targets:
        WorkoutApp: all
    run:
      config: Debug
    archive:
      config: Release
