# XcodeGen spec. On your Mac:
#   brew install xcodegen
#   xcodegen generate
#   open WorkoutApp.xcodeproj
# Set your team and bundle ID once (kept out of git, survives regenerating):
#   scripts/set-signing.sh <TEAM_ID> com.yourname.workoutapp
name: WorkoutApp

options:
  bundleIdPrefix: com.lontraindustries
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Code that needs the iOS 27 SDK (Xcode 27+): FoundationModels'
    # LanguageModelError in OnDeviceCoach. CI builds with Xcode 26 and
    # overrides this to empty on the xcodebuild command line.
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TENSILE_IOS27_SDK"

packages:
  AppCore:
    path: Packages/AppCore

targets:
  WorkoutApp:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: AppCore
      - sdk: HealthKit.framework
      - target: WorkoutWidget
      # The Apple Watch app ships inside the iPhone app ("Embed Watch Content").
      - target: TensileWatch
        embed: true
    entitlements:
      path: App/WorkoutApp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Lets HealthKit wake the app after new data (e.g. a Garmin sync).
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups:
          - group.com.lontraindustries.workoutapp
        # Rest-timer alerts can break through Focus modes.
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tensile
        UILaunchScreen: {}
        UIBackgroundModes:
          - workout-processing
          - fetch
        # The coach's check-ins refresh in the background (`CoachNudges.backgroundRefresh`).
        BGTaskSchedulerPermittedIdentifiers:
          - com.lontraindustries.workoutapp.coach-refresh
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.lontraindustries.workoutapp
            CFBundleURLSchemes:
              - workoutapp
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: >-
          WorkoutApp reads your heart rate, HRV, resting heart rate, sleep, workouts,
          body weight and food log (for example from Cronometer) to calculate your
          daily scores and give coaching advice.
        NSCameraUsageDescription: >-
          WorkoutApp uses the camera for your front and side progress photos (saved only
          inside the app, not in your Photos library) and, with the flashlight, to measure
          your heart rate variability from your fingertip.
        NSLocationWhenInUseUsageDescription: >-
          WorkoutApp uses your location once to get local weather, air quality and
          daylight hours for training advice. You can type your city instead.
        NSHealthUpdateUsageDescription: >-
          WorkoutApp saves the gym workouts (with your effort rating), blood pressure
          readings, breathing sessions, check-in mood and quick meal estimates you log to
          Apple Health.
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

  # Home/Lock Screen widget and the medications Live Activity.
  WorkoutWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: Widget
      - path: Shared
    dependencies:
      # Shared/SharedStore.swift uses AppCore's MedicationSchedule (the Live Activity's doses).
      - package: AppCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework
    entitlements:
      path: Widget/WorkoutWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.lontraindustries.workoutapp
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Tensile
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        # The app's bundle ID (from Config) plus ".widget".
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).widget
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: ""

  # Apple Watch app: logs sets and records the workout (heart rate, calories) on the
  # wrist, so each gym session is one HKWorkout. Single-target watch app (no WatchKit
  # extension); bundle ID is the iPhone app's plus ".watchkitapp".
  TensileWatch:
    type: application
    platform: watchOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
    sources:
      - path: Watch
      # Only the session model and the complications' data are shared: the
      # other Shared files need ActivityKit.
      - path: Shared/WatchSession.swift
      - path: Shared/WatchFaceData.swift
      # The experimental rep counter's signal maths (pure Swift).
      - path: Packages/AppCore/Sources/AppCore/RepDetection.swift
    dependencies:
      - sdk: HealthKit.framework
      - sdk: WatchConnectivity.framework
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      # Watch face complications, embedded in the Watch app (PlugIns).
      - target: TensileWatchWidgets
        embed: true
    entitlements:
      path: Watch/TensileWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Shares the complications' data with TensileWatchWidgets.
        com.apple.security.application-groups:
          - group.com.lontraindustries.workoutapp
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Tensile
        WKApplication: true
        # Complication taps open tensile://start.
        CFBundleURLTypes:
          - CFBundleURLName: com.lontraindustries.workoutapp.watchkitapp
            CFBundleURLSchemes:
              - tensile
        # The iPhone app's bundle ID (Config/Base.xcconfig, or Signing.local.xcconfig).
        WKCompanionAppBundleIdentifier: $(COMPANION_APP_BUNDLE_IDENTIFIER)
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: >-
          Tensile reads your heart rate and active energy during a workout to show
          them on your wrist.
        NSHealthUpdateUsageDescription: >-
          Tensile saves your gym workouts, with heart rate and calories, to Apple Health.
        NSMotionUsageDescription: >-
          Tensile reads your wrist's motion during squat and deadlift sets to count
          reps, only when rep counting is on.
    settings:
      base:
        SDKROOT: watchos
        # The app's bundle ID (from Config) plus ".watchkitapp".
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).watchkitapp
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: $(COMPANION_APP_BUNDLE_IDENTIFIER)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        TARGETED_DEVICE_FAMILY: "4"

  # Watch face complications (WidgetKit): recovery + strain, and the next
  # planned session. Reads what the Watch app stores in the App Group.
  TensileWatchWidgets:
    type: app-extension
    platform: watchOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: WatchWidgets
      - path: Shared/WatchFaceData.swift
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: WatchWidgets/TensileWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.lontraindustries.workoutapp
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Tensile
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SDKROOT: watchos
        # The app's bundle ID (from Config) plus ".watchkitapp.widgets".
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: ""

  # UI tests (run in CI on a simulator).
  WorkoutAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: WorkoutApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lontraindustries.workoutapp.uitests
        TEST_TARGET_NAME: WorkoutApp
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  WorkoutApp:
    build:
      targets:
        WorkoutApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WorkoutAppUITests
    archive:
      config: Release
