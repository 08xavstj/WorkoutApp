# XcodeGen spec. On your Mac:
#   brew install xcodegen
#   xcodegen generate
#   open WorkoutApp.xcodeproj
# Then pick your team under Signing & Capabilities (or set DEVELOPMENT_TEAM below).
name: WorkoutApp

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: "" # put your 10-character Apple team ID here
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  AppCore:
    path: Packages/AppCore

targets:
  WorkoutApp:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: AppCore
      - sdk: HealthKit.framework
    entitlements:
      path: App/WorkoutApp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: WorkoutApp
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: >-
          WorkoutApp reads your heart rate, HRV, resting heart rate, sleep, workouts,
          body weight and food log (for example from Cronometer) to calculate your
          daily scores and give coaching advice.
        NSHealthUpdateUsageDescription: >-
          WorkoutApp saves the gym workouts you log to Apple Health.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.workoutapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  WorkoutApp:
    build:
      targets:
        WorkoutApp: all
    run:
      config: Debug
    archive:
      config: Release
