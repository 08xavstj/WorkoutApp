# XcodeGen spec. On your Mac:
#   brew install xcodegen
#   xcodegen generate
#   open WorkoutApp.xcodeproj
# Set your team and bundle ID once (kept out of git, survives regenerating):
#   scripts/set-signing.sh <TEAM_ID> com.yourname.workoutapp
name: WorkoutApp

options:
  bundleIdPrefix: com.lontraindustries
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  AppCore:
    path: Packages/AppCore

targets:
  WorkoutApp:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: AppCore
      - sdk: HealthKit.framework
      - target: WorkoutWidget
    entitlements:
      path: App/WorkoutApp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Lets HealthKit wake the app after new data (e.g. a Garmin sync).
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups:
          - group.com.lontraindustries.workoutapp
        # Rest-timer alerts can break through Focus modes.
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: WorkoutApp
        UILaunchScreen: {}
        UIBackgroundModes:
          - workout-processing
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.lontraindustries.workoutapp
            CFBundleURLSchemes:
              - workoutapp
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: >-
          WorkoutApp reads your heart rate, HRV, resting heart rate, sleep, workouts,
          body weight and food log (for example from Cronometer) to calculate your
          daily scores and give coaching advice.
        NSCameraUsageDescription: >-
          WorkoutApp uses the camera for your front and side progress photos (saved only
          inside the app, not in your Photos library) and, with the flashlight, to measure
          your heart rate variability from your fingertip.
        NSLocationWhenInUseUsageDescription: >-
          WorkoutApp uses your location once to get local weather, air quality and
          daylight hours for training advice. You can type your city instead.
        NSHealthUpdateUsageDescription: >-
          WorkoutApp saves the gym workouts and blood pressure readings you log to Apple
          Health.
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

  # Home/Lock Screen widget and the medications Live Activity.
  WorkoutWidget:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: Widget
      - path: Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework
    entitlements:
      path: Widget/WorkoutWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.lontraindustries.workoutapp
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: WorkoutApp
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        # The app's bundle ID (from Config) plus ".widget".
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).widget
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: ""

  # UI tests (run in CI on a simulator).
  WorkoutAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: WorkoutApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lontraindustries.workoutapp.uitests
        TEST_TARGET_NAME: WorkoutApp
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  WorkoutApp:
    build:
      targets:
        WorkoutApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WorkoutAppUITests
    archive:
      config: Release
