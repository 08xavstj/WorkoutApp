name: Diagnose check-in crash

# Temporary: runs the app in a simulator, opens the morning and evening
# check-ins the way a notification tap does, and prints any crash report and
# the app's log. Delete once the crash is fixed.

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

concurrency:
  group: diagnose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick and boot a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime, devices in sorted(data.items(), reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Tap the check-in notifications in a UI test
        run: |
          mkdir -p logs
          xcrun simctl spawn "$UDID" log stream --level debug --style compact \
            --predicate 'category == "diagnostics" OR (process == "WorkoutApp" AND (messageType == fault OR messageType == error))' \
            > logs/diag.log 2>&1 &
          LOGPID=$!
          set +e
          xcodebuild test \
            -project WorkoutApp.xcodeproj \
            -scheme WorkoutApp \
            -destination "id=$UDID" \
            -configuration Debug \
            -derivedDataPath build \
            -resultBundlePath logs/ui.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            > logs/uitest.log 2>&1
          STATUS=$?
          set -e
          kill $LOGPID || true
          echo "=== app diagnostics log ==="
          grep -E "didReceive|router.open|pending|checkIn changed|screen appeared|Fatal|fatal|crash|assert" logs/diag.log | tail -80
          echo "=== test results ==="
          grep -E "error:|Test Case|crash|Crash|failed|passed|XCTAssert|isn't running|no longer running|didn't" logs/uitest.log | tail -80
          echo "=== screen dumps on failure ==="
          grep -A60 -E "APP STATE after tap|SCREEN after tap" logs/uitest.log | head -150
          echo "=== crash reports ==="
          for f in $(find ~/Library/Logs/DiagnosticReports -mmin -60 -name "*WorkoutApp*" 2>/dev/null | head -3); do
            echo "--- $f"; head -c 40000 "$f"; echo
          done
          echo "=== crash logs inside the test results ==="
          xcrun xcresulttool get test-results tests --path logs/ui.xcresult 2>/dev/null | head -c 20000 || true
          find logs/ui.xcresult -iname "*crash*" -o -iname "*.ips" 2>/dev/null | head
          for f in $(find logs/ui.xcresult -type f \( -iname "*crash*" -o -iname "*.ips" \) 2>/dev/null | head -3); do
            echo "--- $f"; head -c 40000 "$f"; echo
          done
          echo "xcodebuild test exit status: $STATUS"

      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose
          path: logs
