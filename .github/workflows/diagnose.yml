name: Diagnose check-in crash

# Temporary: runs the app in a simulator, opens the morning and evening
# check-ins the way a notification tap does, and prints any crash report and
# the app's log. Delete once the crash is fixed.

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

concurrency:
  group: diagnose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick and boot a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime, devices in sorted(data.items(), reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Build for that simulator
        run: |
          xcodebuild build \
            -project WorkoutApp.xcodeproj \
            -scheme WorkoutApp \
            -destination "id=$UDID" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Open the check-ins and look for crashes
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/WorkoutApp.app
          BUNDLE=com.lontraindustries.workoutapp
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant all "$BUNDLE" || true
          mkdir -p logs
          xcrun simctl spawn "$UDID" log stream --level debug --style compact \
            --predicate 'process == "WorkoutApp"' > logs/app.log 2>&1 &
          LOGPID=$!
          for kind in morning evening; do
            echo "=== $kind ==="
            xcrun simctl terminate "$UDID" "$BUNDLE" || true
            # -hasOnboarded YES skips onboarding through UserDefaults' argument domain.
            xcrun simctl launch "$UDID" "$BUNDLE" -hasOnboarded YES
            sleep 12
            xcrun simctl openurl "$UDID" "workoutapp://checkin/$kind"
            sleep 12
            if xcrun simctl spawn "$UDID" launchctl list | grep -q "$BUNDLE"; then
              echo "App still running after opening the $kind check-in."
            else
              echo "APP IS NOT RUNNING after opening the $kind check-in (crashed?)."
            fi
            xcrun simctl io "$UDID" screenshot "logs/$kind.png" || true
          done
          # Cold launch straight into a check-in, like tapping a notification while the app is closed.
          for kind in morning evening; do
            echo "=== cold launch: $kind (console) ==="
            xcrun simctl terminate "$UDID" "$BUNDLE" || true
            sleep 2
            # --console streams the app's stdout/stderr (Swift fatal errors) until it exits.
            ( xcrun simctl launch --console-pty "$UDID" "$BUNDLE" -hasOnboarded YES -openCheckInAtLaunch "$kind" > "logs/console-$kind.txt" 2>&1 & echo $! > logs/console.pid )
            sleep 25
            kill "$(cat logs/console.pid)" 2>/dev/null || true
            tail -c 6000 "logs/console-$kind.txt"
            if xcrun simctl spawn "$UDID" launchctl list > logs/launchctl.txt 2>/dev/null && grep -q "$BUNDLE" logs/launchctl.txt; then
              echo "App still running after cold launch into the $kind check-in."
            else
              echo "APP IS NOT RUNNING after cold launch into the $kind check-in."
            fi
            xcrun simctl io "$UDID" screenshot "logs/cold-$kind.png" || true
          done
          echo "=== cold launch through openurl ==="
          xcrun simctl terminate "$UDID" "$BUNDLE" || true
          sleep 2
          xcrun simctl openurl "$UDID" "workoutapp://checkin/morning"
          sleep 20
          xcrun simctl spawn "$UDID" launchctl list > logs/launchctl.txt 2>/dev/null || true
          grep "$BUNDLE" logs/launchctl.txt || echo "Not running after openurl cold launch."
          kill $LOGPID || true
          sleep 20
          echo "=== crash reports ==="
          find ~/Library/Logs/DiagnosticReports ~/Library/Logs/CrashReporter -mmin -40 \( -name "*WorkoutApp*" -o -name "*.ips" \) -print 2>/dev/null | head -20
          for f in $(find ~/Library/Logs/DiagnosticReports -mmin -40 -name "*WorkoutApp*" 2>/dev/null | head -3); do
            echo "--- $f"; head -c 30000 "$f"; echo
          done
          echo "=== system log mentioning WorkoutApp (last 3 min) ==="
          xcrun simctl spawn "$UDID" log show --last 3m --style compact \
            --predicate 'process == "WorkoutApp" OR eventMessage CONTAINS[c] "workoutapp"' 2>/dev/null \
            | grep -iE "fatal|crash|terminat|exit|assert|executor|isolat|exception|signal|abort|jetsam|killed|watchdog" | tail -80 || true

      - name: Keep screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose
          path: logs
