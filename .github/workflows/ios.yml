name: iOS build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test scoring package
        run: swift test --package-path Packages/AppCore

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # The Watch app first, on its own, so a watch compile error is reported
      # by name and a simulator hang can't eat the whole job silently.
      - name: Build the Watch app for the simulator
        timeout-minutes: 12
        run: |
          xcodebuild build \
            -project WorkoutApp.xcodeproj \
            -target TensileWatch \
            -sdk watchsimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | tee watch-build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" watch-build.log

      - name: Build app for the simulator
        timeout-minutes: 12
        run: |
          xcodebuild build \
            -project WorkoutApp.xcodeproj \
            -scheme WorkoutApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
