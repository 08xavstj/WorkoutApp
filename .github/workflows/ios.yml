name: iOS build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test scoring package
        run: swift test --package-path Packages/AppCore

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # The Watch app first, on its own, so a watch compile error is reported
      # by name and a simulator hang can't eat the whole job silently.
      - name: Build the Watch app for the simulator
        timeout-minutes: 12
        run: |
          xcodebuild build \
            -project WorkoutApp.xcodeproj \
            -target TensileWatch \
            -sdk watchsimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG' \
            | tee watch-build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" watch-build.log

      - name: Build app for the simulator
        timeout-minutes: 12
        run: |
          xcodebuild build \
            -project WorkoutApp.xcodeproj \
            -scheme WorkoutApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG' \
            | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

  # The owner's iPhone runs iOS 27 and his Apple Watch Series 12 runs
  # watchOS 27.2.x, which need Xcode 27.2 (its iOS 27.2 / watchOS 27.2 SDKs
  # and device support) to install from the Mac. This job builds with that
  # Xcode on every push, for the simulators and for real devices (arm64
  # iPhone and Watch, signing off), so a device-only compile error shows here
  # before he tries to install.
  build-xcode-27:
    runs-on: xcode-27
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
          xcodebuild -showsdks | grep -E "watchos|iphoneos" || true
          swift --version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build the Watch app for the simulator
        timeout-minutes: 15
        run: |
          xcodebuild build \
            -project WorkoutApp.xcodeproj \
            -target TensileWatch \
            -sdk watchsimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG' \
            | tee watch-build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" watch-build.log

      - name: Build app for the simulator
        timeout-minutes: 20
        run: |
          xcodebuild build \
            -project WorkoutApp.xcodeproj \
            -scheme WorkoutApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG' \
            | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Build the Watch app for a real Watch
        timeout-minutes: 15
        run: |
          xcodebuild build \
            -project WorkoutApp.xcodeproj \
            -target TensileWatch \
            -sdk watchos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            | tee watch-device.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" watch-device.log

      - name: Build the app (with its Watch app) for a real iPhone
        timeout-minutes: 20
        run: |
          xcodebuild build \
            -project WorkoutApp.xcodeproj \
            -scheme WorkoutApp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            | tee device.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" device.log
