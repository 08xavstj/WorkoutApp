name: Screenshots

# Captures every page and sheet in the simulator for design review, on the
# made-up demo dataset (`-demoData YES`, App/Services/DemoData.swift). Runs
# only for commits whose message contains "[screens]", or by hand. The images
# are printed into the log as base64 JPEGs between "=== SHOT <name> ===" and
# "=== END ===" markers, so they can be read without downloading artifacts;
# steps the tour couldn't find are printed as "MISSING <name>" lines.

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

# One run per commit, never cancelled by a later push (each run is a record
# of how that commit looked).
concurrency:
  group: screenshots-${{ github.sha }}
  cancel-in-progress: false

jobs:
  shots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screens]')
    runs-on: macos-26
    timeout-minutes: 80  # the tour now covers ~120 screens; printing them needs the extra minutes
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Boot a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime, devices in sorted(data.items(), reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d["name"].startswith("iPhone 17 Pro") or d["name"].startswith("iPhone 16 Pro"):
                      print(d["udid"]); sys.exit()
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          # Light mode, like the default app look.
          xcrun simctl ui "$UDID" appearance light
          # The status bar shows the demo clock (`DemoHealth.pinnedNow`, 8:10),
          # so the screenshots don't say 14:32 above "8:10 this morning".
          xcrun simctl status_bar "$UDID" override --time 08:10 --batteryState charged --batteryLevel 100 || true

      - name: Capture screens
        run: |
          set +e
          # Every 45 s, sample the app's main thread so a hang can be traced.
          (
            for i in $(seq 1 40); do
              sleep 45
              PID=$(pgrep -x WorkoutApp | head -1)
              [ -n "$PID" ] && sample "$PID" 3 -file "app-sample-$i.txt" >/dev/null 2>&1
            done
          ) &
          SAMPLER=$!
          xcodebuild test \
            -project WorkoutApp.xcodeproj \
            -scheme WorkoutApp \
            -destination "id=$UDID" \
            -configuration Debug \
            -only-testing:WorkoutAppUITests/ScreenshotTests \
            -resultBundlePath shots.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG' \
            > test.log 2>&1
          echo "xcodebuild exit: $?"
          kill $SAMPLER 2>/dev/null
          grep -E "error:|Test Case|passed|failed" test.log | tail -20
          grep -E "MISSING " test.log | sort -u | head -100 || true

      - name: Show where the app was busy
        if: always()
        run: |
          # Samples taken during the run (a hung main thread shows up in the
          # test as "Timed out while requesting screenshot").
          for f in app-sample-*.txt; do
            [ -f "$f" ] || continue
            echo "=== SAMPLE $f ==="
            awk '/Thread_.*main-thread|com.apple.main-thread/{p=1} p{print; n++} n>120{exit}' "$f"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-xcresult
          path: |
            shots.xcresult
            test.log
            app-sample-*.txt
          retention-days: 3

      - name: Print screenshots
        run: |
          mkdir -p shots
          xcrun xcresulttool export attachments --path shots.xcresult --output-path shots
          cd shots
          python3 - <<'PY'
          import json, os, subprocess, base64
          manifest = json.load(open("manifest.json"))
          items = []
          for test in manifest:
              for a in test.get("attachments", []):
                  items.append((a.get("suggestedHumanReadableName") or a["exportedFileName"], a["exportedFileName"]))
          for name, file in sorted(items):
              raw = open(file, "rb").read()
              if raw[:3] == b"\xff\xd8\xff":
                  # Already a small JPEG (ScreenshotTests saves 1x, quality 0.5).
                  data = base64.b64encode(raw).decode()
              elif raw[:8] == b"\x89PNG\r\n\x1a\n":
                  out = file + ".jpg"
                  subprocess.run(["sips", "-Z", "900", "-s", "format", "jpeg", "-s", "formatOptions", "55", file, "--out", out],
                                 check=True, capture_output=True)
                  data = base64.b64encode(open(out, "rb").read()).decode()
              elif not file.endswith(".txt") and b"\x00" in raw[:512]:
                  # Binary attachments (screen recording, UI snapshots): in the artifact.
                  print(f"=== SKIP {name} ===")
                  continue
              else:
                  # A text note (the MISSING list).
                  print(f"=== NOTE {name} ===")
                  print(raw.decode("utf-8", "replace"))
                  print("=== END ===")
                  continue
              print(f"=== SHOT {name} ===")
              for i in range(0, len(data), 4000):
                  print(data[i:i+4000])
              print("=== END ===")
          PY

  # The Watch's Set, Rest, Controls and Heart pages in the watchOS simulator, on the 46 mm and 42 mm
  # watches at the default text size and two larger ones, from the debug-only demo lift (`-demoLift YES`,
  # `WatchWorkoutModel.loadDemoLift`): Back Squat, set 3 of 3, a rest running.
  # Printed like the phone's shots, as "=== SHOT watch-... ===" blocks. Runs
  # with "[screens]", or alone with "[watch-screens]" in the commit message.
  watch-shots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screens]') || contains(github.event.head_commit.message, '[watch-screens]')
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick Watch simulators
        run: |
          # The largest and smallest current Series: 46 mm and 42 mm.
          xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          found = {}
          for runtime, devices in sorted(data.items(), reverse=True):
              if "watchOS" not in runtime:
                  continue
              for d in sorted(devices, key=lambda d: d["name"], reverse=True):
                  for mm in ("46mm", "42mm"):
                      if mm not in found and d["name"].startswith("Apple Watch Series") and mm in d["name"]:
                          found[mm] = d["udid"]
          for mm, udid in found.items():
              print(f"{mm} {udid}")
          ' > watches.txt
          cat watches.txt
          [ -s watches.txt ] || { xcrun simctl list devices available; exit 1; }
          echo "UDID=$(head -1 watches.txt | cut -d' ' -f2)" >> "$GITHUB_ENV"

      - name: Build the Watch app
        timeout-minutes: 20
        run: |
          xcodebuild build \
            -project WorkoutApp.xcodeproj \
            -scheme TensileWatch \
            -destination "id=$UDID" \
            -configuration Debug \
            -derivedDataPath dd \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG' \
            | tee watch-build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" watch-build.log

      - name: Capture the Set, Rest, Controls and Heart pages
        run: |
          APP=$(find dd/Build/Products -maxdepth 2 -name "*.app" -path "*watchsimulator*" | head -1)
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          mkdir -p watch-shots
          while read -r MM DEVICE; do
            xcrun simctl boot "$DEVICE"
            xcrun simctl bootstatus "$DEVICE" -b
            xcrun simctl install "$DEVICE" "$APP"
            # The default text size, then two larger ones (Settings > Display &
            # Brightness > Text Size), set per launch through UIKit's preference.
            for page in set rest controls heart; do
              for size in L XXL XXXL; do
                xcrun simctl terminate "$DEVICE" "$BUNDLE" 2>/dev/null || true
                xcrun simctl launch "$DEVICE" "$BUNDLE" -demoLift YES -demoLiftPage "$page" -demoFitDebug YES \
                  -UIPreferredContentSizeCategoryName "UICTContentSizeCategory$size"
                sleep 12
                xcrun simctl io "$DEVICE" screenshot "watch-shots/watch-$page-$MM-$size.png"
              done
            done
            xcrun simctl shutdown "$DEVICE"
          done < watches.txt
          cd watch-shots
          for f in *.png; do
            name=$(basename "$f" .png)
            sips -s format jpeg -s formatOptions 70 "$f" --out "$name.jpg" >/dev/null
            echo "=== SHOT $name ==="
            base64 -i "$name.jpg" | fold -w 4000
            echo "=== END ==="
          done

      - name: Upload Watch shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-shots
          path: |
            watch-shots
            watch-build.log
          retention-days: 3
